name: Build S20 Ultra Docker Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch & Khắc phục libtinfo.so.5
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget unzip python3 python-is-python3 libncurses5-dev cpio tar lz4 libncurses-dev \
            dos2unix patch libncurses5 libtinfo5 || true

          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Tải công cụ Magiskboot
        run: |
          if [ ! -f "/tmp/tools/magiskboot" ]; then
            mkdir -p /tmp/tools
            wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O /tmp/magisk.apk
            unzip -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/tools/
            mv /tmp/tools/libmagiskboot.so /tmp/tools/magiskboot
            chmod +x /tmp/tools/magiskboot
          fi
          echo "/tmp/tools" >> $GITHUB_PATH

      - name: Tải Toolchain Chuẩn GoRhanHee
        run: |
          rm -rf toolchain
          git clone --depth=1 https://github.com/GoRhanHee/aarch64-android-4.9_llvm-10.0.git toolchain

      - name: Tải mã nguồn Kernel S20 Series & Patch Toàn Diện
        run: |
          rm -rf src
          git clone --depth=1 https://github.com/GoRhanHee/kernel_samsung_sm8250.git -b x1q src

          # Kéo KernelSU-Next
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b legacy /tmp/ksu
          rm -rf src/drivers/kernelsu && mkdir -p src/drivers/kernelsu
          cp -r /tmp/ksu/kernel/* src/drivers/kernelsu/
          cp -r /tmp/ksu/include src/drivers/kernelsu/ 2>/dev/null || true
          cp -r /tmp/ksu/uapi src/drivers/kernelsu/ 2>/dev/null || true
          if [ -d "/tmp/ksu/include/uapi" ]; then
            cp -r /tmp/ksu/include/uapi src/drivers/kernelsu/
          fi

          # Áp dụng bản vá manual hooks
          cd src
          curl -fsSL https://raw.githubusercontent.com/WildKernels/kernel_patches/main/next/scope_min_manual_hooks_v1.6.patch -o /tmp/manual_hooks.patch
          patch -p1 -N < /tmp/manual_hooks.patch || echo "Manual hooks da duoc tich hop san"
          cd ..

          # Làm sạch Kconfig và sửa lỗi DTC yylloc
          find src/ -name "Kconfig*" -type f -exec sed -i 's/\xc2\xa0/ /g; s/\r$//; s/^\xef\xbb\xbf//' {} +
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' src/scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' src/scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true

      - name: Nạp .config Chuẩn GoRhanHee & Gộp cờ Docker
        run: |
          # 1. Nạp toàn bộ thư mục bin vào PATH
          for bin_path in $(find $GITHUB_WORKSPACE/toolchain -type d -name "bin"); do
              export PATH=$bin_path:$PATH
          done

          # 2. Xác định tiền tố CROSS_COMPILE một cách an toàn
          AARCH64_LD=$(find $GITHUB_WORKSPACE/toolchain -name "aarch64-linux-android-ld" | head -n 1)
          if [ -n "$AARCH64_LD" ]; then
              GCC64_PREFIX=$(echo "$AARCH64_LD" | sed 's/ld$//')
          else
              GCC64_PREFIX="aarch64-linux-android-"
          fi

          ARM32_LD=$(find $GITHUB_WORKSPACE/toolchain -name "arm-linux-androideabi-ld" | head -n 1)
          if [ -n "$ARM32_LD" ]; then
              GCC32_PREFIX=$(echo "$ARM32_LD" | sed 's/ld$//')
          else
              GCC32_PREFIX="arm-linux-androideabi-"
          fi

          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=${GCC64_PREFIX} CROSS_COMPILE_ARM32=${GCC32_PREFIX} HOSTCFLAGS=-fcommon HOSTCXXFLAGS=-fcommon"

          cd src
          cp $GITHUB_WORKSPACE/config/z3q_base.config .config
          scripts/kconfig/merge_config.sh -m .config $GITHUB_WORKSPACE/config/docker.config
          make $MAKE_ARGS olddefconfig

      - name: Bắt đầu Biên dịch Kernel Chuẩn GoRhanHee
        run: |
          for bin_path in $(find $GITHUB_WORKSPACE/toolchain -type d -name "bin"); do
              export PATH=$bin_path:$PATH
          done

          AARCH64_LD=$(find $GITHUB_WORKSPACE/toolchain -name "aarch64-linux-android-ld" | head -n 1)
          if [ -n "$AARCH64_LD" ]; then
              GCC64_PREFIX=$(echo "$AARCH64_LD" | sed 's/ld$//')
          else
              GCC64_PREFIX="aarch64-linux-android-"
          fi

          ARM32_LD=$(find $GITHUB_WORKSPACE/toolchain -name "arm-linux-androideabi-ld" | head -n 1)
          if [ -n "$ARM32_LD" ]; then
              GCC32_PREFIX=$(echo "$ARM32_LD" | sed 's/ld$//')
          else
              GCC32_PREFIX="arm-linux-androideabi-"
          fi

          export KSU_GIT_VERSION="12450"
          export KSU_VERSION_TAG="v1.0.5"
          
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=${GCC64_PREFIX} CROSS_COMPILE_ARM32=${GCC32_PREFIX} HOSTCFLAGS=-fcommon HOSTCXXFLAGS=-fcommon"

          cd src
          make $MAKE_ARGS -j$(nproc)

      - name: Tự động tráo ruột và đóng gói file boot_docker.tar cho Odin
        run: |
          mkdir -p output
          cp src/arch/arm64/boot/Image output/Image

          if [ -f "stock/boot.img" ]; then
              echo "===> Phat hien stock/boot.img, bat dau dong goi qua magiskboot..."
              mkdir -p /tmp/repack && cd /tmp/repack
              cp $GITHUB_WORKSPACE/stock/boot.img ./boot.img
              
              magiskboot unpack boot.img
              cp $GITHUB_WORKSPACE/output/Image ./kernel
              magiskboot repack boot.img new-boot.img
              mv new-boot.img boot.img
              
              tar -cvf $GITHUB_WORKSPACE/output/boot_docker.tar boot.img
              echo "===> Dong goi boot_docker.tar thanh cong!"
          else
              echo "===> Khong tim thay stock/boot.img, chi xuat file Image tho."
          fi

      - name: Xuất bản lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "S20 Ultra Docker Kernel (Official GoRhanHee LLVM 10) v1.0.${{ github.run_number }}"
          body: |
            ### Bản phát hành Kernel S20 Ultra (Biên dịch chính thức bằng Toolchain GoRhanHee)
            * Trình biên dịch: Sử dụng 100% LLVM 10.0 + GCC 4.9 chính chủ từ GoRhanHee.
            * Nền tảng: Sử dụng 100% file .config gốc đã trích xuất từ bản z3q_SuSFS của GoRhanHee.
            * Tích hợp: Bổ sung Docker Native, Cgroups, Namespaces, OverlayFS, USB-LAN RTL8153B.
            * Quyền Root: KernelSU-Next và SuSFS tích hợp sẵn.
          files: |
            output/*
