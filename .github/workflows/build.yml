name: Build S20 Ultra Docker Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cài đặt công cụ nền tảng
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget unzip python3 python-is-python3 libncurses5-dev cpio tar lz4 libncurses-dev \
            dos2unix patch libncurses5 libtinfo5 || true

          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true

      # GỌI TRỰC TIẾP FILE SCRIPT ĐÃ TEST THÀNH CÔNG Ở LOCAL
      - name: Thực thi kịch bản biên dịch chuẩn
        run: |
          # Thiết lập workspace tương đương Podman
          sudo mkdir -p /workspace
          sudo mount --bind $GITHUB_WORKSPACE /workspace
          chmod +x ./build_local.sh
          ./build_local.sh

      - name: Xuất bản lên GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "S20 Ultra Docker Kernel v1.0.${{ github.run_number }}"
          body: |
            ### Bản phát hành Kernel S20 Ultra hoàn chỉnh
            * Đồng bộ 100% giữa kịch bản kiểm thử cục bộ và hệ thống CI/CD.
            * Tích hợp đầy đủ Docker Native, Cgroups, Namespaces, OverlayFS, USB-LAN RTL8153B.
            * Nhúng sẵn KernelSU-Next và SuSFS.
          files: |
            output/*
