name: Build S20 Ultra Docker Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget unzip python3 python-is-python3 libncurses5-dev cpio tar lz4 libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu dos2unix ccache

      - name: Thiết lập Bộ nhớ đệm (Cache)
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            ~/.ccache
          key: ${{ runner.os }}-kernel-build-cache-v1
          restore-keys: |
            ${{ runner.os }}-kernel-build-cache-

      - name: Tải công cụ Magiskboot
        run: |
          if [ ! -f "/tmp/tools/magiskboot" ]; then
            mkdir -p /tmp/tools
            wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O /tmp/magisk.apk
            unzip -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/tools/
            mv /tmp/tools/libmagiskboot.so /tmp/tools/magiskboot
            chmod +x /tmp/tools/magiskboot
          fi
          echo "/tmp/tools" >> $GITHUB_PATH

      - name: Tải Toolchain Proton-Clang
        run: |
          if [ ! -d "toolchain/bin" ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
            rm -f toolchain/bin/as toolchain/bin/ld
          fi

      - name: Tải mã nguồn Kernel S20 Series & Patch Toàn Diện
        run: |
          git clone --depth=1 https://github.com/xwenx90/GalaxyS20_Series_KernelSU_Next_Susfs.git -b x1q src
          
          # 1. Kéo KernelSU-Next và copy ĐẦY ĐỦ
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b legacy /tmp/ksu
          rm -rf src/drivers/kernelsu && mkdir -p src/drivers/kernelsu
          cp -r /tmp/ksu/kernel/* src/drivers/kernelsu/
          cp -r /tmp/ksu/include src/drivers/kernelsu/ 2>/dev/null || true
          cp -r /tmp/ksu/uapi src/drivers/kernelsu/ 2>/dev/null || true
          if [ -d "/tmp/ksu/include/uapi" ]; then
            cp -r /tmp/ksu/include/uapi src/drivers/kernelsu/
          fi

          # 2. Làm sạch Kconfig và patch KSU Hooks + Include Paths
          find src/ -name "Kconfig*" -type f -exec sed -i 's/\xc2\xa0/ /g; s/\r$//; s/^\xef\xbb\xbf//' {} +
          sed -i '/No hooks were defined/d' src/drivers/kernelsu/Kbuild
          sed -i '1i ccflags-y += -DCONFIG_KSU_MANUAL_HOOK -DCONFIG_KSU_SUSFS -I$(srctree)/drivers/kernelsu -I$(srctree)/drivers/kernelsu/include -I$(srctree)/drivers/kernelsu/uapi' src/drivers/kernelsu/Kbuild

          # 3. Vá lỗi strscpy_pad trong kernel_compat.h
          find src/drivers/kernelsu/ -type f -exec sed -i 's/return strscpy_pad(dest, src, count);/strncpy(dest, src, count); return strlen(dest);/g' {} +
          find src/drivers/kernelsu/ -type f -exec sed -i 's/\bstrscpy_pad\b/strncpy/g' {} +

          # 4. Sửa lỗi DTC yylloc và Typo fdinfo
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' src/scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' src/scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/mask, mark->ignored_mask/mark->mask, mark->ignored_mask/g' src/fs/notify/fdinfo.c

          # 5. Vá lỗi đường dẫn Trace & Camera Header & Input Booster
          sed -i 's|#define TRACE_INCLUDE_PATH \.|#define TRACE_INCLUDE_PATH ../../drivers/hid|' src/drivers/hid/hid-trace.h 2>/dev/null || true
          sed -i 's|#define TRACE_INCLUDE_PATH \.|#define TRACE_INCLUDE_PATH ../../techpack/display/pll|' src/techpack/display/pll/pll_trace.h 2>/dev/null || true
          sed -i 's|#include "cam_cci_dev.h"|#include "../cam_cci/cam_cci_dev.h"|g' src/techpack/camera/drivers/cam_sensor_module/cam_sensor_io/cam_sensor_i2c.h 2>/dev/null || true
          sed -i 's/int is_ib_init_succeed()/int is_ib_init_succeed(void)/g' src/drivers/input/input_booster.c 2>/dev/null || true

          # 6. Sửa lỗi Broadcom Wi-Fi
          sed -i '1i #pragma clang diagnostic ignored "-Wframe-address"' src/drivers/net/wireless/broadcom/bcmdhd_101_16/dhd_linux.c 2>/dev/null || true
          find src/drivers/net/wireless/broadcom/ -name "Makefile*" -type f -exec sed -i 's/-Werror\b//g' {} +

          # 7. Fix stpcpy
          sed -i 's/KBUILD_CFLAGS   :=/KBUILD_CFLAGS   := -fno-builtin-stpcpy -fno-builtin /g' src/Makefile

          # 8. FIX LLD RELOCATION: Chèn trực tiếp -z notext vào Makefile của ARM64
          sed -i 's/LDFLAGS_vmlinux\s*:=/LDFLAGS_vmlinux := -z notext /g' src/arch/arm64/Makefile 2>/dev/null || true
          sed -i 's/LDFLAGS_vmlinux\s*+=/LDFLAGS_vmlinux += -z notext /g' src/arch/arm64/Makefile 2>/dev/null || true

      - name: Nạp .config Chuẩn Gốc GoRhanHee & Gộp cờ Docker
        run: |
          cd src
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCFLAGS=-fcommon HOSTCXXFLAGS=-fcommon"

          # 1. Sử dụng 100% file config gốc vừa trích xuất từ Podman
          cp $GITHUB_WORKSPACE/config/z3q_base.config .config

          # 2. Gộp các cờ Docker & USB-LAN vào
          scripts/kconfig/merge_config.sh -m .config $GITHUB_WORKSPACE/config/docker.config
          make $MAKE_ARGS olddefconfig

      - name: Bắt đầu Biên dịch Kernel
        run: |
          cd src
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          export KSU_GIT_VERSION="12450"
          export KSU_VERSION_TAG="v1.0.5"
          
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCFLAGS=-fcommon HOSTCXXFLAGS=-fcommon"

          make $MAKE_ARGS -j$(nproc)

      - name: Tự động tráo ruột và đóng gói file boot_docker.tar cho Odin
        run: |
          mkdir -p output
          cp src/arch/arm64/boot/Image output/Image

          if [ -f "stock/boot.img" ]; then
              echo "===> Phat hien stock/boot.img, bat dau dong goi qua magiskboot..."
              mkdir -p /tmp/repack && cd /tmp/repack
              cp $GITHUB_WORKSPACE/stock/boot.img ./boot.img
              
              magiskboot unpack boot.img
              cp $GITHUB_WORKSPACE/output/Image ./kernel
              magiskboot repack boot.img new-boot.img
              mv new-boot.img boot.img
              
              tar -cvf $GITHUB_WORKSPACE/output/boot_docker.tar boot.img
              echo "===> Dong goi boot_docker.tar thanh cong!"
          else
              echo "===> Khong tim thay stock/boot.img, chi xuat file Image tho."
          fi

      - name: Xuất bản lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "S20 Ultra Docker Kernel (Verified GoRhanHee Base) v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 Bản phát hành Kernel S20 Ultra (Nền tảng .config gốc chuẩn 100% của GoRhanHee)
            * **Độ ổn định:** Sử dụng chính xác file .config trích xuất từ bản z3q_SuSFS của GoRhanHee.
            * **Tích hợp:** Bổ sung Docker Native, Cgroups, Namespaces, OverlayFS.
            * **Driver:** Hỗ trợ mạng dây USB-to-LAN (Realtek RTL8153B / ASIX).
            * **Cách dùng:** Tải file `boot_docker.tar` nạp vào slot **AP** trong Odin.
          files: |
            output/*
