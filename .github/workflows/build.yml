name: Build S20 Ultra Docker Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
            git curl python3 python-is-python3 libncurses5-dev cpio tar lz4 libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi dos2unix

      - name: Tải Toolchain Proton-Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Tải mã nguồn Kernel S20 Series & Copy KernelSU-Next (Nhánh Legacy)
        run: |
          # 1. Kéo mã nguồn kernel
          git clone --depth=1 https://github.com/xwenx90/GalaxyS20_Series_KernelSU_Next_Susfs.git -b x1q src

          # 2. Kéo KernelSU-Next
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b legacy /tmp/ksu

          # 3. Copy toàn bộ thư mục kernel vào src/drivers/kernelsu
          rm -rf src/drivers/kernelsu
          cp -r /tmp/ksu/kernel src/drivers/kernelsu

          # 4. Tự động làm sạch toàn bộ ký tự lạ / UTF-8 BOM / CRLF trong các file Kconfig
          find src/ -name "Kconfig*" -type f -exec sed -i 's/\xc2\xa0/ /g; s/\r$//; s/^\xef\xbb\xbf//' {} +

      - name: Cấu hình Defconfig & Gộp cờ Docker
        run: |
          cd src
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          # Tự động chọn file defconfig chuẩn cho nền tảng Snapdragon 865 (Kona)
          if [ -f "arch/arm64/configs/vendor/kona-perf_defconfig" ]; then
              TARGET_DEFCONFIG="vendor/kona-perf_defconfig"
          elif [ -f "arch/arm64/configs/vendor/kona_defconfig" ]; then
              TARGET_DEFCONFIG="vendor/kona_defconfig"
          elif [ -f "arch/arm64/configs/kona_sec_defconfig" ]; then
              TARGET_DEFCONFIG="kona_sec_defconfig"
          else
              TARGET_DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          echo "===> Dang nap defconfig: $TARGET_DEFCONFIG"
          make $MAKE_ARGS $TARGET_DEFCONFIG

          # Gộp cờ Docker & KernelSU Manual Hooks
          scripts/kconfig/merge_config.sh -m .config $GITHUB_WORKSPACE/config/docker.config
          make $MAKE_ARGS olddefconfig

      - name: Bắt đầu Biên dịch Kernel
        run: |
          cd src
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          # Khai báo phiên bản KSU để bỏ qua cảnh báo
          export KSU_GIT_VERSION="12450"

          make $MAKE_ARGS -j$(nproc)

      - name: Đóng gói thành phẩm
        run: |
          mkdir -p output
          cp src/arch/arm64/boot/Image output/Image
          echo "Build thành công!"

      - name: Tải thành phẩm lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S20Ultra-Docker-KernelSU
          path: output/Image
