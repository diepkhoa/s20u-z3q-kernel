name: Build S20 Ultra Docker Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch & đóng gói
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget unzip python3 python-is-python3 libncurses5-dev cpio tar lz4 libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi dos2unix

      - name: Tải công cụ Magiskboot chính thức
        run: |
          mkdir -p /tmp/tools
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O /tmp/magisk.apk
          unzip -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/tools/
          mv /tmp/tools/libmagiskboot.so /tmp/tools/magiskboot
          chmod +x /tmp/tools/magiskboot
          echo "/tmp/tools" >> $GITHUB_PATH

      - name: Tải Toolchain Proton-Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Tải mã nguồn Kernel S20 Series & Patch KernelSU-Next + Sửa DTC yylloc
        run: |
          # 1. Kéo mã nguồn kernel
          git clone --depth=1 https://github.com/xwenx90/GalaxyS20_Series_KernelSU_Next_Susfs.git -b x1q src

          # 2. Kéo KernelSU-Next nhánh legacy
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b legacy /tmp/ksu

          # 3. Copy toàn bộ thư mục kernel vào src/drivers/kernelsu
          rm -rf src/drivers/kernelsu
          cp -r /tmp/ksu/kernel src/drivers/kernelsu

          # 4. Tự động làm sạch toàn bộ ký tự lạ trong các file Kconfig
          find src/ -name "Kconfig*" -type f -exec sed -i 's/\xc2\xa0/ /g; s/\r$//; s/^\xef\xbb\xbf//' {} +

          # 5. Patch KSU Kbuild: Bỏ qua lỗi check hook và ép cờ Manual Hook
          sed -i '/No hooks were defined/d' src/drivers/kernelsu/Kbuild
          sed -i '1i ccflags-y += -DCONFIG_KSU_MANUAL_HOOK -DCONFIG_KSU_SUSFS' src/drivers/kernelsu/Kbuild

          # 6. SỬA LỖI DTC YYLLOC: Chuyển biến yylloc thành extern
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' src/scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' src/scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true

      - name: Cấu hình Defconfig & Gộp cờ Docker + KernelSU
        run: |
          cd src
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- AS=aarch64-linux-gnu-as HOSTCFLAGS=-fcommon HOSTCXXFLAGS=-fcommon"

          # Nạp defconfig chuẩn của Snapdragon 865 (Kona)
          if [ -f "arch/arm64/configs/vendor/kona-perf_defconfig" ]; then
              TARGET_DEFCONFIG="vendor/kona-perf_defconfig"
          elif [ -f "arch/arm64/configs/vendor/kona_defconfig" ]; then
              TARGET_DEFCONFIG="vendor/kona_defconfig"
          elif [ -f "arch/arm64/configs/kona_sec_defconfig" ]; then
              TARGET_DEFCONFIG="kona_sec_defconfig"
          else
              TARGET_DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          echo "===> Dang nap defconfig: $TARGET_DEFCONFIG"
          make $MAKE_ARGS $TARGET_DEFCONFIG

          # Gộp cờ Docker & KernelSU
          scripts/kconfig/merge_config.sh -m .config $GITHUB_WORKSPACE/config/docker.config
          make $MAKE_ARGS olddefconfig

      - name: Bắt đầu Biên dịch Kernel
        run: |
          cd src
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          export KSU_GIT_VERSION="12450"
          export KSU_VERSION_TAG="v1.0.5"
          
          # Truyền đầy đủ AS và HOSTCFLAGS để fix dứt điểm lỗi '-EL' và 'yylloc'
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- AS=aarch64-linux-gnu-as HOSTCFLAGS=-fcommon HOSTCXXFLAGS=-fcommon"

          make $MAKE_ARGS -j$(nproc)

      - name: Tự động tráo ruột và đóng gói file boot_docker.tar cho Odin
        run: |
          mkdir -p output
          cp src/arch/arm64/boot/Image output/Image

          # Kiểm tra nếu có file stock/boot.img thì tự động tráo ruột và đóng gói tar
          if [ -f "stock/boot.img" ]; then
              echo "===> Phat hien stock/boot.img, bat dau dong goi qua magiskboot..."
              mkdir -p /tmp/repack && cd /tmp/repack
              cp $GITHUB_WORKSPACE/stock/boot.img ./boot.img
              
              # 1. Rã nén boot.img gốc
              magiskboot unpack boot.img
              
              # 2. Thay thế kernel cũ bằng Image mới vừa biên dịch
              cp $GITHUB_WORKSPACE/output/Image ./kernel
              
              # 3. Đóng gói lại thành boot.img mới
              magiskboot repack boot.img new-boot.img
              mv new-boot.img boot.img
              
              # 4. Nén thành file .tar cho Odin
              tar -cvf $GITHUB_WORKSPACE/output/boot_docker.tar boot.img
              echo "===> Dong goi boot_docker.tar thanh cong!"
          else
              echo "===> Khong tim thay stock/boot.img, chi xuat file Image tho."
          fi

      - name: Tải thành phẩm lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S20Ultra-Odin-Flashable
          path: output/
